// 准星 1；几何尺寸为按分辨率缩放的像素值。
// 仅列已确认范围；尺寸项不标注未经确认的硬性上下限。

crosshair "1" // 准星显示 [0/1]
cl_crosshair_recoil "1" // 后坐力跟随 [0/1]

// Style [0,9]：0 动态十字 / 1 动态圆环 / 2 经典动态十字 / 3 静态圆环 / 4 静态十字
// 5 静态十字（射击反馈）/ 6 点 / 7 动态四象限 / 8 静态方框 / 9 静态四象限
cl_crosshairstyle "2"
cl_crosshair_dynamic_spread_limit "255" // 现代动态样式 0/1/7：128px 基线外的额外扩散上限

// Geometry (px)
cl_crosshair_length "110" // 线长；0 = 隐藏线段
cl_crosshair_thickness "32" // 线宽；渲染至少 1px
cl_crosshair_gap "128" // 中心间距偏移

// Fill RGBA [0,255]
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "150"
cl_crosshaircolor_b "0"
cl_crosshaircolor_a "255"

// Shape / outline
cl_crosshairdot "0" // 中心点 [0/1]
cl_crosshair_t "0" // T 形 [0/1]；隐藏上边
cl_crosshair_drawoutline "1" // 0 = Off，1 = Full，2 = Half

// Outline RGBA [0,255]
cl_crosshairoutline_r "0"
cl_crosshairoutline_g "0"
cl_crosshairoutline_b "0"
cl_crosshairoutline_a "255"

cl_crosshair_friendly_warning "0" // 友军警告；0 = Off
cl_crosshair_sniper_width "1" // 狙击镜线宽；1 = 单像素

// Legacy dynamics：仅 Style 2；内段占比 = 1 - 外段占比。
cl_crosshair_dynamic_maxdist_splitratio "0.9" // 外段线长占比 [0,1]
cl_crosshair_dynamic_splitalpha_innermod "1" // 内段 alpha 倍率 [0,1]
cl_crosshair_dynamic_splitalpha_outermod "1" // 外段 alpha 倍率 [0.3,1]
cl_crosshair_dynamic_splitdist "10" // 分裂距离阈值

// Scope dot
cl_ironsight_usecrosshaircolor "0" // 镜内点使用准星颜色 [0/1]
cl_ironsight_dot_scale "1" // 镜内点缩放倍率

// Observer
cl_show_observer_crosshair "2" // 0 Off / 1 好友及队伍 / 2 所有人
cl_observed_bot_crosshair "1" // 0 自己 / 1 可接管时自己 / 2 默认

// Grenade line-up [0/1]；explosive = HE，fire = Molotov / Incendiary
cl_grenadecrosshair_keepusercrosshair "1" // 保留普通准星
cl_grenadecrosshair_flash "0"
cl_grenadecrosshair_explosive "0"
cl_grenadecrosshair_fire "0"
cl_grenadecrosshair_smoke "0"
cl_grenadecrosshair_decoy "0"

// Pin-pull delay (s)：拔销后显示投掷辅助准星的延迟。
cl_grenadecrosshairdelay_flash "1"
cl_grenadecrosshairdelay_explosive "1"
cl_grenadecrosshairdelay_fire "1"
cl_grenadecrosshairdelay_smoke "1"
cl_grenadecrosshairdelay_decoy "1"
