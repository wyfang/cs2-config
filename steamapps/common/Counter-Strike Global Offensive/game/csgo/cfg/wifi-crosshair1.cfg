// 跟随后坐力的白色中心点，保留静态十字样式与中心点组合。
// O 键的另一套准星为 wifi-crosshair2.cfg。
crosshair "1"
cl_crosshair_recoil "1"
cl_crosshairstyle "4"

// 旧厚度 1.2 不是像素值；先以 2 像素迁移，需在游戏中目视确认。
cl_crosshair_thickness "2"

// 横线长度与间距归零，仅显示中心点，覆盖上一套的大尺寸状态。
cl_crosshair_length "0"
cl_crosshair_gap "0"
cl_crosshairdot "1"
cl_crosshair_t "0"

// 保留原来的白色、透明度 160 与完整描边。
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_a "160"
cl_crosshair_drawoutline "1"
cl_crosshair_friendly_warning "0"
cl_crosshair_sniper_width "1"

// 显式设置动态参数，保证两套准星可以独立加载；静态样式不使用这些值。
cl_crosshair_dynamic_spread_limit "255"
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
