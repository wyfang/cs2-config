// ============================================================================
// Runtime definitions only: does not bind keys or save configuration.
// Release movement keys before reloading these definitions.
// Initialization
// ============================================================================

joy_side_sensitivity 1
joy_forward_sensitivity 1


// ============================================================================
// Wi-Fi SOCD - A / D
// Last Input Priority for horizontal movement
// ============================================================================

alias "+wifi-a" "rightleft -1 0 0; alias +wifi-d wifi-ad"

alias "wifi-left1" "rightleft -1 0 0; alias +wifi-d wifi-ad"

alias "wifi-ad" "rightleft 1 0 0; alias -wifi-d wifi-add; alias -wifi-a wifi-ada"

alias "-wifi-a" "rightleft 0 0 0; alias +wifi-d wifi-right1; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2; alias +wifi-a wifi-left1"

alias "wifi-left2" "rightleft 0 0 0; alias +wifi-d wifi-right1; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2; alias +wifi-a wifi-left1"

alias "+wifi-d" "rightleft 1 0 0; alias +wifi-a wifi-da"

alias "wifi-right1" "rightleft 1 0 0; alias +wifi-a wifi-da"

alias "wifi-da" "rightleft -1 0 0; alias -wifi-a wifi-ada; alias -wifi-d wifi-add"

alias "-wifi-d" "rightleft 0 0 0; alias +wifi-a wifi-left1; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2; alias +wifi-d wifi-right1"

alias "wifi-right2" "rightleft 0 0 0; alias +wifi-a wifi-left1; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2; alias +wifi-d wifi-right1"

alias "wifi-add" "rightleft -1 0 0; alias +wifi-d wifi-ad; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2"

alias "wifi-ada" "rightleft 1 0 0; alias +wifi-a wifi-da; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2"


// ============================================================================
// Wi-Fi SOCD - W / S
// Last Input Priority for forward / backward movement
// ============================================================================

alias "+wifi-w" "forwardback 1 0 0; alias +wifi-s wifi-ws"

alias "wifi-forward1" "forwardback 1 0 0; alias +wifi-s wifi-ws"

alias "wifi-ws" "forwardback -1 0 0; alias -wifi-s wifi-wss; alias -wifi-w wifi-wsw"

alias "-wifi-w" "forwardback 0 0 0; alias +wifi-s wifi-back1; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2; alias +wifi-w wifi-forward1"

alias "wifi-forward2" "forwardback 0 0 0; alias +wifi-s wifi-back1; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2; alias +wifi-w wifi-forward1"

alias "+wifi-s" "forwardback -1 0 0; alias +wifi-w wifi-sw"

alias "wifi-back1" "forwardback -1 0 0; alias +wifi-w wifi-sw"

alias "wifi-sw" "forwardback 1 0 0; alias -wifi-w wifi-wsw; alias -wifi-s wifi-wss"

alias "-wifi-s" "forwardback 0 0 0; alias +wifi-w wifi-forward1; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2; alias +wifi-s wifi-back1"

alias "wifi-back2" "forwardback 0 0 0; alias +wifi-w wifi-forward1; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2; alias +wifi-s wifi-back1"

alias "wifi-wss" "forwardback 1 0 0; alias +wifi-s wifi-ws; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2"

alias "wifi-wsw" "forwardback -1 0 0; alias +wifi-w wifi-sw; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2"

// Legacy analog OFF aliases, retained only for compatibility with older saved bindings.
// Current wifi-socd-off.cfg binds native movement directly; migrate with exec wifi-socd-reset.
alias "+wifi-normal-a" "rightleft -1 0 0; alias +wifi-normal-d wifi-normal-ad"
alias "wifi-normal-left1" "rightleft -1 0 0; alias +wifi-normal-d wifi-normal-ad"
alias "wifi-normal-ad" "rightleft 0 0 0; alias -wifi-normal-d wifi-normal-add; alias -wifi-normal-a wifi-normal-ada"
alias "-wifi-normal-a" "rightleft 0 0 0; alias +wifi-normal-d wifi-normal-right1; alias -wifi-normal-d wifi-normal-right2; alias -wifi-normal-a wifi-normal-left2; alias +wifi-normal-a wifi-normal-left1"
alias "wifi-normal-left2" "rightleft 0 0 0; alias +wifi-normal-d wifi-normal-right1; alias -wifi-normal-d wifi-normal-right2; alias -wifi-normal-a wifi-normal-left2; alias +wifi-normal-a wifi-normal-left1"
alias "+wifi-normal-d" "rightleft 1 0 0; alias +wifi-normal-a wifi-normal-da"
alias "wifi-normal-right1" "rightleft 1 0 0; alias +wifi-normal-a wifi-normal-da"
alias "wifi-normal-da" "rightleft 0 0 0; alias -wifi-normal-a wifi-normal-ada; alias -wifi-normal-d wifi-normal-add"
alias "-wifi-normal-d" "rightleft 0 0 0; alias +wifi-normal-a wifi-normal-left1; alias -wifi-normal-a wifi-normal-left2; alias -wifi-normal-d wifi-normal-right2; alias +wifi-normal-d wifi-normal-right1"
alias "wifi-normal-right2" "rightleft 0 0 0; alias +wifi-normal-a wifi-normal-left1; alias -wifi-normal-a wifi-normal-left2; alias -wifi-normal-d wifi-normal-right2; alias +wifi-normal-d wifi-normal-right1"
alias "wifi-normal-add" "rightleft -1 0 0; alias +wifi-normal-d wifi-normal-ad; alias -wifi-normal-a wifi-normal-left2; alias -wifi-normal-d wifi-normal-right2"
alias "wifi-normal-ada" "rightleft 1 0 0; alias +wifi-normal-a wifi-normal-da; alias -wifi-normal-d wifi-normal-right2; alias -wifi-normal-a wifi-normal-left2"
alias "+wifi-normal-w" "forwardback 1 0 0; alias +wifi-normal-s wifi-normal-ws"
alias "wifi-normal-forward1" "forwardback 1 0 0; alias +wifi-normal-s wifi-normal-ws"
alias "wifi-normal-ws" "forwardback 0 0 0; alias -wifi-normal-s wifi-normal-wss; alias -wifi-normal-w wifi-normal-wsw"
alias "-wifi-normal-w" "forwardback 0 0 0; alias +wifi-normal-s wifi-normal-back1; alias -wifi-normal-s wifi-normal-back2; alias -wifi-normal-w wifi-normal-forward2; alias +wifi-normal-w wifi-normal-forward1"
alias "wifi-normal-forward2" "forwardback 0 0 0; alias +wifi-normal-s wifi-normal-back1; alias -wifi-normal-s wifi-normal-back2; alias -wifi-normal-w wifi-normal-forward2; alias +wifi-normal-w wifi-normal-forward1"
alias "+wifi-normal-s" "forwardback -1 0 0; alias +wifi-normal-w wifi-normal-sw"
alias "wifi-normal-back1" "forwardback -1 0 0; alias +wifi-normal-w wifi-normal-sw"
alias "wifi-normal-sw" "forwardback 0 0 0; alias -wifi-normal-w wifi-normal-wsw; alias -wifi-normal-s wifi-normal-wss"
alias "-wifi-normal-s" "forwardback 0 0 0; alias +wifi-normal-w wifi-normal-forward1; alias -wifi-normal-w wifi-normal-forward2; alias -wifi-normal-s wifi-normal-back2; alias +wifi-normal-s wifi-normal-back1"
alias "wifi-normal-back2" "forwardback 0 0 0; alias +wifi-normal-w wifi-normal-forward1; alias -wifi-normal-w wifi-normal-forward2; alias -wifi-normal-s wifi-normal-back2; alias +wifi-normal-s wifi-normal-back1"
alias "wifi-normal-wss" "forwardback 1 0 0; alias +wifi-normal-s wifi-normal-ws; alias -wifi-normal-w wifi-normal-forward2; alias -wifi-normal-s wifi-normal-back2"
alias "wifi-normal-wsw" "forwardback -1 0 0; alias +wifi-normal-w wifi-normal-sw; alias -wifi-normal-s wifi-normal-back2; alias -wifi-normal-w wifi-normal-forward2"

// Four I phases. Rebind I only on key-up, after its matching release handler runs.
// Each I down/up event contains at most one movement-axis command.
// Release all WASD keys before every I press, including while RESET is selected.
// The two RESET phases select different destinations; ON wraps back to RESET -> OFF.
// Native OFF button releases must finish before WASD is rebound; I only clears analog axes.
alias "wifi-socd-neutral" ""
alias "+wifi-i-on" "exec wifi-socd-reset-to-off"
alias "-wifi-i-on" "rightleft 0 0 0; bind scancode12 +wifi-i-reset-off; host_writeconfig; say_team SOCD-RESET"
alias "+wifi-i-off" "exec wifi-socd-reset-to-on"
alias "-wifi-i-off" "rightleft 0 0 0; bind scancode12 +wifi-i-reset-on; host_writeconfig; say_team SOCD-RESET"
alias "+wifi-i-reset-off" ""
alias "-wifi-i-reset-off" "exec wifi-socd-off"
alias "+wifi-i-reset-on" ""
alias "-wifi-i-reset-on" "exec wifi-socd"
