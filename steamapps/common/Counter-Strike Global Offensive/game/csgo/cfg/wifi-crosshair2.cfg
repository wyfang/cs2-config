// 个人常规准星：按 2026-09-23 游戏截图使用新版像素参数。
// O 键的另一套准星为 wifi-crosshair1.cfg；两套均跟随后坐力。
crosshair "1"
cl_crosshair_recoil "1"

// Dynamic Quad：动态元素反映武器实际不准度。
cl_crosshairstyle "7"
cl_crosshair_dynamic_spread_limit "255"

// 长度、粗细、间距均为当前分辨率下的像素值。
cl_crosshair_length "120"
cl_crosshair_thickness "31"
cl_crosshair_gap "128"

// 白色，透明度与截图一致（0 为透明，255 为不透明）。
cl_crosshaircolor_r "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "255"
cl_crosshaircolor_a "254"

// 无额外中心点、无 T 形、无描边；显式覆盖上一套准星的状态。
// 描边：0 = 无，1 = 完整，2 = 半描边。
cl_crosshairdot "0"
cl_crosshair_t "0"
cl_crosshair_drawoutline "0"
cl_crosshair_friendly_warning "0"
cl_crosshair_sniper_width "1"

// 与截图保持一致；以下四项仅影响旧动态样式 2。
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
