// 展示准星 2：四线动态十字，无中心圆环，使用新版像素参数。
// 本文件为准星 2；启动加载及 O 键切换顺序由主配置控制。
crosshair "1"
cl_crosshair_recoil "1"

// Dynamic Cross：四条线随武器实际不准度变化，不绘制中心圆环。
cl_crosshairstyle "3"
cl_crosshair_dynamic_spread_limit "255"

// 使用展示尺寸；动态元素的位置由武器实际不准度决定。
cl_crosshair_length "120"
cl_crosshair_thickness "32"
cl_crosshair_gap "9999"

// 保留文件当前的 RGB 和不透明度；描边使用独立颜色和不透明度。
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "0"
cl_crosshaircolor_b "0"
cl_crosshaircolor_a "255"

// 无额外中心点、无 T 形；保留四条线，使用完整描边。
// 描边：0 = 无，1 = 完整，2 = 半描边。
cl_crosshairdot "0"
cl_crosshair_t "0"
cl_crosshair_drawoutline "1"
cl_crosshair_friendly_warning "0"
cl_crosshair_sniper_width "1"

// 保留旧动态样式参数；以下四项仅影响样式 2，不影响当前样式 0。
cl_crosshair_dynamic_maxdist_splitratio "1"
cl_crosshair_dynamic_splitalpha_innermod "0"
cl_crosshair_dynamic_splitalpha_outermod "1"
cl_crosshair_dynamic_splitdist "3"
