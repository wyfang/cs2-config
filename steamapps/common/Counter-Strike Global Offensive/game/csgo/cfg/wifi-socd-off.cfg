// Restore native keyboard movement, including normal scoreboard input handling.
// Release WASD before switching; use exec wifi-socd-reset once to migrate old bindings.
// Prepare both movement modes and I handlers without changing viewmodel, crosshair or HUD.
exec wifi-socd-core

bind scancode4 "+left"
bind scancode7 "+right"
bind scancode26 "+forward"
bind scancode22 "+back"

// Save standard movement bindings for the next game launch.
// I down clears forward/back; I up clears left/right and selects RESET -> ON.
bind scancode12 "+wifi-i-off"
host_writeconfig

// Announce the selected state to teammates.
say_team "SOCD-OFF"

