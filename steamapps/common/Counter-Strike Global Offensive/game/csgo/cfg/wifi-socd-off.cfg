// Disable SOCD without reloading the viewmodel, crosshair or HUD.
// Clear directional input, then restore standard WASD bindings.
-left
-right
-forward
-back
rightleft 0 0 0
forwardback 0 0 0

bind scancode4 "+left"
bind scancode7 "+right"
bind scancode26 "+forward"
bind scancode22 "+back"

// Save standard movement bindings for the next game launch.
host_writeconfig

