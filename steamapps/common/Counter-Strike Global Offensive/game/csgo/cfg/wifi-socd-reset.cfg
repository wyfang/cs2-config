// Console-only movement recovery; release WASD before running.
// Do not bind this file to I: one input event would contain multiple movement commands.
// Clear digital buttons and analog axes, then restore normal WASD.
-forward
-back
-left
-right
forwardback 0 0 0
rightleft 0 0 0
exec wifi-socd-off
echo "Wi-Fi movement input reset; SOCD OFF."
