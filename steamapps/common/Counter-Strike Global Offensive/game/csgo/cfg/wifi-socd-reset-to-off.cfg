// I key-down half of RESET. Do not rebind I here: its key-up handler must still run.
// The matching I key-up clears the horizontal axis and selects the next phase.
forwardback 0 0 0
bind scancode26 wifi-socd-neutral
bind scancode22 wifi-socd-neutral
bind scancode4 wifi-socd-neutral
bind scancode7 wifi-socd-neutral
