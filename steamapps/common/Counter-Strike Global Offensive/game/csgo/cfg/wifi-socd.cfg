// ============================================================================
// Initialization
// ============================================================================

joy_side_sensitivity 1
joy_forward_sensitivity 1


// ============================================================================
// Wi-Fi SOCD - A / D
// Last Input Priority for horizontal movement
// ============================================================================

alias "+wifi-a" "rightleft -1 0 0; alias +wifi-d wifi-ad"

alias "wifi-left1" "rightleft -1 0 0; alias +wifi-d wifi-ad"

alias "wifi-ad" "rightleft 1 0 0; alias -wifi-d wifi-add; alias -wifi-a wifi-ada"

alias "-wifi-a" "rightleft 0 0 0; alias +wifi-d wifi-right1; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2; alias +wifi-a wifi-left1"

alias "wifi-left2" "rightleft 0 0 0; alias +wifi-d wifi-right1; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2; alias +wifi-a wifi-left1"

alias "+wifi-d" "rightleft 1 0 0; alias +wifi-a wifi-da"

alias "wifi-right1" "rightleft 1 0 0; alias +wifi-a wifi-da"

alias "wifi-da" "rightleft -1 0 0; alias -wifi-a wifi-ada; alias -wifi-d wifi-add"

alias "-wifi-d" "rightleft 0 0 0; alias +wifi-a wifi-left1; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2; alias +wifi-d wifi-right1"

alias "wifi-right2" "rightleft 0 0 0; alias +wifi-a wifi-left1; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2; alias +wifi-d wifi-right1"

alias "wifi-add" "rightleft -1 0 0; alias +wifi-d wifi-ad; alias -wifi-a wifi-left2; alias -wifi-d wifi-right2"

alias "wifi-ada" "rightleft 1 0 0; alias +wifi-a wifi-da; alias -wifi-d wifi-right2; alias -wifi-a wifi-left2"


// ============================================================================
// Wi-Fi SOCD - W / S
// Last Input Priority for forward / backward movement
// ============================================================================

alias "+wifi-w" "forwardback 1 0 0; alias +wifi-s wifi-ws"

alias "wifi-forward1" "forwardback 1 0 0; alias +wifi-s wifi-ws"

alias "wifi-ws" "forwardback -1 0 0; alias -wifi-s wifi-wss; alias -wifi-w wifi-wsw"

alias "-wifi-w" "forwardback 0 0 0; alias +wifi-s wifi-back1; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2; alias +wifi-w wifi-forward1"

alias "wifi-forward2" "forwardback 0 0 0; alias +wifi-s wifi-back1; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2; alias +wifi-w wifi-forward1"

alias "+wifi-s" "forwardback -1 0 0; alias +wifi-w wifi-sw"

alias "wifi-back1" "forwardback -1 0 0; alias +wifi-w wifi-sw"

alias "wifi-sw" "forwardback 1 0 0; alias -wifi-w wifi-wsw; alias -wifi-s wifi-wss"

alias "-wifi-s" "forwardback 0 0 0; alias +wifi-w wifi-forward1; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2; alias +wifi-s wifi-back1"

alias "wifi-back2" "forwardback 0 0 0; alias +wifi-w wifi-forward1; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2; alias +wifi-s wifi-back1"

alias "wifi-wss" "forwardback 1 0 0; alias +wifi-s wifi-ws; alias -wifi-w wifi-forward2; alias -wifi-s wifi-back2"

alias "wifi-wsw" "forwardback -1 0 0; alias +wifi-w wifi-sw; alias -wifi-s wifi-back2; alias -wifi-w wifi-forward2"


// ============================================================================
// Wi-Fi SOCD - Key Bindings
// ============================================================================

bind a +wifi-a
bind d +wifi-d
bind w +wifi-w
bind s +wifi-s


// ============================================================================
// Loaded Message
// ============================================================================

echo "============================================================"
echo " Wi-Fi SOCD"
echo " CFG-based Last Input Priority"
echo " WANGYIFANG.COM"
echo "============================================================"
echo "[Wi-Fi SOCD] Loaded successfully | WANGYIFANG.COM"