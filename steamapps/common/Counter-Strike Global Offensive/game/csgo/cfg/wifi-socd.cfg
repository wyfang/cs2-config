// Prepare runtime commands and clear input before enabling SOCD.
exec wifi-socd-core
-left
-right
-forward
-back
rightleft 0 0 0
forwardback 0 0 0

// ============================================================================
// Wi-Fi SOCD - Key Bindings
// ============================================================================

bind scancode4 +wifi-a
bind scancode7 +wifi-d
bind scancode26 +wifi-w
bind scancode22 +wifi-s

// Save the selected movement bindings for the next game launch.
host_writeconfig

