alias "mic_on" "+voicerecord; alias mic_toggle mic_off"
alias "mic_off" "-voicerecord; alias mic_toggle mic_on"
alias "mic_toggle" "mic_on"
bind "scancode56" "mic_toggle"

alias "f5_say_leetify" "say GET LEETIFY; bind scancode62 f5_say_allstar"
alias "f5_say_allstar" "say !allstar; bind scancode62 f5_say_leetify"
bind "scancode62" "f5_say_leetify"

alias "f6_say_glhf" "say I wish everyone GLHF, and maintain a good attitude. After all, this is just a game. Happy is the most important thing. GLHF :); bind scancode63 f6_say_commend"
alias "f6_say_commend" "say And does anyone want to compliment each other? I really want this.; bind scancode63 f6_say_instructions"
alias "f6_say_instructions" "say Open scoreboard > Click my name > Select Commend > Tick all 3 boxes > Click OK, please let me know, I can also commend you.; bind scancode63 f6_say_glhf"
bind "scancode63" "f6_say_glhf"

alias "f7_say_commend" "say 但我更喜欢赞美，这对我很重要，能给我3个赞美吗？按住键盘TAB，点我的头像，找到并点击微笑。; bind scancode64 f7_say_instructions"
alias "f7_say_instructions" "say 您将看到一个会话框，勾选3个选项并按提交，如果您的已提交，请告诉我，我也会提交给您！; bind scancode64 f7_say_commend"
bind "scancode64" "f7_say_commend"

// C4 countdown messages restored from the original key backup.
bind "scancode66" "say C4 倒计时 7秒提示 - 来自 live.steam.pet"
bind "scancode67" "say C4 倒计时 12秒提示 - 来自 live.steam.pet"

// Crosshair cycle: 1 -> 2 -> 3 -> 1.
alias wifi-crosshair1 "exec wifi-crosshair1;bind scancode18 wifi-crosshair2"
alias wifi-crosshair2 "exec wifi-crosshair2;bind scancode18 wifi-crosshair3"
alias wifi-crosshair3 "exec wifi-crosshair3;bind scancode18 wifi-crosshair1"
bind scancode19 "exec autoexec"

alias wifi-view1 "viewmodel_presetpos 1;viewmodel_offset_x -2;viewmodel_offset_y -2;viewmodel_offset_z 2;viewmodel_fov 54;wifi-crosshair1;cl_hud_color 11;bind mouse5 wifi-view2"
alias wifi-view2 "viewmodel_presetpos 1;viewmodel_offset_x 1;viewmodel_offset_y 1;viewmodel_offset_z -1;viewmodel_fov 60;wifi-crosshair2;cl_hud_color 0;bind mouse5 wifi-view1"

// Prepare SOCD commands without overwriting the saved movement bindings.
// I toggles using its saved binding. Do not reset I or WASD on reload.
// Enable: exec wifi-socd | Disable: exec wifi-socd-off
exec wifi-socd-core

// Startup: apply view mode 1, crosshair 1 and its HUD. Mouse5 then selects mode 2.
wifi-view1

